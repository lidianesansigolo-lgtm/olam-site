<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo — ŌLAM</title>
<meta name="description" content="O Arquivo ŌLAM registra a casa.">
<meta name="theme-color" content="#2F3A34">
<link rel="stylesheet" href="assets/css/olam.css">
</head>
<body class="paper">
<main>
<div class="wrap page-head">
  <p class="label mute">Arquivo ŌLAM</p>
  <h1 class="title">O Arquivo registra aquilo que aconteceu. Nunca aquilo que seria conveniente ter acontecido.</h1>
</div>
<section class="wrap section bare">
  <div class="cols">
    <figure class="fig bleed wide ratio-32 reveal">
      <img src="assets/img/arquivo-mesa.jpg" alt="Mesa de arquivo com gavetas, desenhos técnicos, minerais brutos e luvas brancas." width="1600" height="1066" decoding="async">
      <figcaption class="label">Estudo de direção visual. Não constitui registro.</figcaption>
    </figure>
    <div class="side stack reveal">
      <p class="body">Objetos, séries, processos, imagens e registros da casa.</p>
      <p class="body">Construído no presente para que exista história no futuro.</p>
    </div>
  </div>
</section>
<section class="wrap section stack">
  <h2 class="label">Registros</h2>
  <div data-render="arquivo"></div>
</section>
</main>
<script src="assets/js/content.js"></script>
<script src="assets/js/olam.js"></script>
</body>
</html>
